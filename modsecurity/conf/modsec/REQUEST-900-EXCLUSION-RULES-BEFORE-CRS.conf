# Deactivate Rule 920180 to permit empty Body on POST without header Content-Length
# It's a best pratice but not required as said in RFC 9110
# This refer to issue #68

SecRule REQUEST_URI "@beginsWith /api/" \
    "id:10001,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveById=920180"

#Fix grafana metrics loading, modsec block some PromQL queries without this

SecRule REQUEST_URI "@beginsWith /admin/grafana/api/ds/query" \
	"id:10002, \
	phase:1, \
	nolog, \
	pass, \
	ctl:ruleRemoveById=942100-942999,ctl:ruleRemoveById=932100-932999"

#An other fix for grafana, modsec flags theses as SQL injection

SecRule REQUEST_URI "@beginsWith /admin/grafana/api/datasources/uid/" \
    "id:10003, \
	phase:1, \
	nolog, \
	pass, \
	ctl:ruleRemoveById=942290"

#Fix Kibana logs viewing

SecRule REQUEST_URI "@beginsWith /admin/kibana/internal/" \
    "id:10004, \
	phase:1, \
	nolog, \
	pass, \
	ctl:ruleRemoveById=942220"

#Other fixes for kibana

SecRule REQUEST_URI "@beginsWith /admin/kibana/" \
    "id:10005,\
     phase:1,\
     nolog,\
     pass,\
     ctl:ruleRemoveByTag=OWASP_CRS/PROTOCOL-ENFORCEMENT,\
     ctl:ruleRemoveById=200005"

#Permit grafana dashboard saving with big json

SecRuleRemoveById 200007

SecRule &ARGS "@ge 5000" \
    "id:1200007,\
	phase:2,\
	t:none,\
	log,\
	deny,\
	status:400,\
	msg:'Failed to fully parse request body due to large argument count',\
	severity:2"

#This flag dashboard saving as SQL injection

SecRule REQUEST_METHOD "@streq PUT" \
    "id:10006,\
     phase:1,\
     nolog,\
     pass,\
     chain"

SecRule REQUEST_URI "@beginsWith /admin/grafana/apis/dashboard.grafana.app/" \
    "phase:1,\
     nolog,\
     ctl:ruleRemoveById=932130,\
     ctl:ruleRemoveById=942100,\
     ctl:ruleRemoveById=942290"